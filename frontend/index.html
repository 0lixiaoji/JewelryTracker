<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d4a574" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="首饰管家" />
    <title>首饰管家</title>
    <!-- 预加载 WASM，浏览器提前下载 -->
    <link rel="preload" href="./sql-wasm-browser.wasm" as="fetch" crossorigin="anonymous" />
    <style>
      /* 首屏 loading，React 挂载后自动消失 */
      #preloader {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        height: 100vh; height: 100dvh;
        background: #fdf6f0; color: #999;
        font-family: system-ui, sans-serif;
      }
      #preloader .spinner {
        width: 36px; height: 36px;
        border: 3px solid #eee; border-top-color: #d4a574; border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #preloader p { margin-top: 16px; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="preloader">
        <div class="spinner"></div>
        <p>首饰管家加载中…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
          if (reg.waiting) reg.waiting.postMessage('skipWaiting');
          if (reg.installing) {
            reg.installing.addEventListener('statechange', function() {
              if (this.state === 'activated') location.reload();
            });
          }
        }).catch(function(err) {
          console.log('SW failed:', err);
        });
      }
    </script>
  </body>
</html>
