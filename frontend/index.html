<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/JewelryTracker/icon-192.png" />
    <link rel="manifest" href="/JewelryTracker/manifest.json" />
    <link rel="apple-touch-icon" href="/JewelryTracker/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d4a574" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="首饰管家" />
    <title>首饰管家</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/JewelryTracker/sw.js')
          .then(function(reg) {
            console.log('SW registered:', reg.scope);
          })
          .catch(function(err) {
            console.log('SW registration failed:', err);
          });
      }
    </script>
  </body>
</html>
